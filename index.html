<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening WhatsApp</title>

<script>
window.onload = function() {
    var message = "Hello I need ticket";
    
    // Android Direct Open
    window.location.href = "intent://send?phone=918482018896&text=" + encodeURIComponent(message) + "#Intent;scheme=smsto;package=com.whatsapp;end";
    
    // Fallback after 1 sec
    setTimeout(function(){
        window.location.href = "https://api.whatsapp.com/send?phone=918482018896&text=" + encodeURIComponent(message);
    }, 1000);
};
</script>

</head>

<body></body>
</html>
